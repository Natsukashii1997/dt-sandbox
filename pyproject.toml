[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-lite"
version = "0.1.0"
description = "极简命令行待办清单"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["todo_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
